<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" aria-labelledby="title desc">
  <title id="title">How a Hallmark run flows</title>
  <desc id="desc">The app's test suite drives collectors that write stamps. Inference turns stamps into guards; the model builder combines them with the mapping and the catalog into one Alloy check per exposure; the solver's verdicts become the report, with coverage gaps reported beside the findings.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726c; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
    .legend { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
      .arr, .head { stroke: #9c9a92; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
      .legend { fill: #D3D1C7; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="gray"><rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="63" text-anchor="middle">App test suite</text>
    <text class="ts" x="340" y="83" text-anchor="middle">The app's own specs</text></g>
  <line class="arr" x1="340" y1="96" x2="340" y2="134" marker-end="url(#arrow)"/>

  <g class="purple"><rect x="230" y="136" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="159" text-anchor="middle">Collectors</text>
    <text class="ts" x="340" y="179" text-anchor="middle">Hooks in each policy library</text></g>
  <line class="arr" x1="340" y1="192" x2="340" y2="230" marker-end="url(#arrow)"/>

  <g class="purple"><rect x="230" y="232" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="255" text-anchor="middle">Stamp store</text>
    <text class="ts" x="340" y="275" text-anchor="middle">Deduped JSONL in tmp/hallmark</text></g>
  <line class="arr" x1="340" y1="288" x2="340" y2="326" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="230" y="328" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="351" text-anchor="middle">Inference</text>
    <text class="ts" x="340" y="371" text-anchor="middle">Guard = OR of allow-stamps</text></g>
  <line class="arr" x1="340" y1="384" x2="340" y2="422" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="230" y="424" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="447" text-anchor="middle">Model builder</text>
    <text class="ts" x="340" y="467" text-anchor="middle">One check per exposure</text></g>
  <line class="arr" x1="340" y1="480" x2="340" y2="518" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="230" y="520" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="543" text-anchor="middle">Solver</text>
    <text class="ts" x="340" y="563" text-anchor="middle">Alloy CLI or JVM sidecar</text></g>
  <line class="arr" x1="340" y1="576" x2="340" y2="614" marker-end="url(#arrow)"/>

  <g class="gray"><rect x="230" y="616" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="639" text-anchor="middle">Hallmark report</text>
    <text class="ts" x="340" y="659" text-anchor="middle">CLI output or RSpec matcher</text></g>

  <g class="gray"><rect x="30" y="328" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="115" y="351" text-anchor="middle">Mapping</text>
    <text class="ts" x="115" y="371" text-anchor="middle">config/hallmark.rb</text></g>
  <line class="arr" x1="200" y1="356" x2="228" y2="356" marker-end="url(#arrow)"/>

  <g class="gray"><rect x="30" y="424" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="115" y="447" text-anchor="middle">Catalog</text>
    <text class="ts" x="115" y="467" text-anchor="middle">catalog.als patterns</text></g>
  <line class="arr" x1="200" y1="452" x2="228" y2="452" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="470" y="328" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="555" y="351" text-anchor="middle">Coverage</text>
    <text class="ts" x="555" y="371" text-anchor="middle">Not observed gaps</text></g>
  <line class="arr" x1="450" y1="356" x2="468" y2="356" marker-end="url(#arrow)"/>
  <path class="arr" d="M555 384 L555 644 L452 644" marker-end="url(#arrow)"/>

  <g class="purple"><rect x="40" y="700" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts legend" x="62" y="711">Runs inside the app, during its specs</text>
  <g class="teal"><rect x="300" y="700" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts legend" x="322" y="711">Runs afterwards, never per request</text>
</svg>
