# Alloy 6.2 targets Java 17; Debian bookworm ships openjdk-17. The JDK (not
# just the JRE) builds the solver sidecar.
image: ruby:3.4-bookworm

variables:
  HALLMARK_ALLOY_JAR: "$CI_PROJECT_DIR/.cache/hallmark/alloy-6.2.0.jar"
  BUNDLE_PATH: "$CI_PROJECT_DIR/.cache/bundle"

cache:
  key:
    files: [hallmark.gemspec, Gemfile]
  paths: [.cache/]

lint:
  before_script:
    - bundle install --jobs 4
  script:
    - bundle exec rubocop
    - bundle exec srb tc

test:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless
    - bundle install --jobs 4
    - bundle exec bin/hallmark install-sidecar
  script:
    - bundle exec rake test
    # The fixed example must stay clean; the original must keep failing.
    - bundle exec bin/hallmark check examples/medium_clone/hallmark_fixed.rb
    - "! bundle exec bin/hallmark check examples/medium_clone/hallmark.rb"
    - HALLMARK_SOLVER=sidecar bundle exec bin/hallmark check examples/storefront/hallmark_fixed.rb
